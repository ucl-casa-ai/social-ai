version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: social_ai_postgres
    environment:
      POSTGRES_USER: ucl_user
      POSTGRES_PASSWORD: ucl_password
      POSTGRES_DB: social_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
